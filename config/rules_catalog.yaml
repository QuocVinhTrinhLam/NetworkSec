schema_version: "1.0"

use_cases:
  - id: port-scan
    name: Port scan
    description: Detects one source probing multiple ports or services in a short interval.
    match:
      rule_ids: ["100201"]
      groups: ["port_scan", "network_scan"]
    default_severity: high
    mitre:
      - id: T1046
        name: Network Service Discovery
        tactic: Discovery
    recommended_response:
      en: Block or rate-limit the source IP and verify exposed services.
      vi: Chặn hoặc giới hạn tốc độ IP nguồn và kiểm tra các dịch vụ đang công khai.

  - id: network-brute-force
    name: SSH, Telnet or Winbox brute force
    description: Detects repeated authentication failures against network-management services.
    match:
      rule_ids: ["100210", "100211", "100212"]
      groups: ["brute_force", "ssh_brute_force", "telnet_brute_force", "winbox_brute_force"]
    default_severity: critical
    mitre:
      - id: T1110
        name: Brute Force
        tactic: Credential Access
    recommended_response:
      en: Block the source IP, review authentication logs and rotate exposed credentials.
      vi: Chặn IP nguồn, rà soát nhật ký xác thực và thay đổi thông tin đăng nhập có nguy cơ lộ.

  - id: admin-login-success
    name: Administrative login succeeded
    description: Detects a successful administrative login to a managed network device.
    match:
      rule_ids: ["100220"]
      groups: ["admin_login_success", "authentication_success"]
    default_severity: medium
    mitre:
      - id: T1078
        name: Valid Accounts
        tactic: Defense Evasion
    recommended_response:
      en: Confirm the login against the approved change window and investigate unexpected accounts or sources.
      vi: Đối chiếu lần đăng nhập với lịch thay đổi đã duyệt và điều tra tài khoản hoặc nguồn bất thường.

  - id: admin-login-failure
    name: Administrative login failed
    description: Detects a failed administrative login to a managed network device.
    match:
      rule_ids: ["100221"]
      groups: ["admin_login_failed", "authentication_failed"]
    default_severity: high
    mitre:
      - id: T1110
        name: Brute Force
        tactic: Credential Access
    recommended_response:
      en: Validate the source, check for repeated attempts and lock or reset the account when appropriate.
      vi: Xác minh nguồn, kiểm tra các lần thử lặp lại và khóa hoặc đặt lại tài khoản khi cần thiết.

  - id: configuration-change
    name: Network device configuration change
    description: Detects an administrative change to a router, switch or firewall configuration.
    match:
      rule_ids: ["100230"]
      groups: ["config_changed", "configuration_change"]
    default_severity: high
    mitre:
      - id: T1562.001
        name: Impair Defenses - Disable or Modify Tools
        tactic: Defense Evasion
    recommended_response:
      en: Compare the running configuration with the approved baseline and identify the operator.
      vi: So sánh cấu hình đang chạy với bản chuẩn đã duyệt và xác định người thực hiện thay đổi.

  - id: interface-flapping
    name: Interface flapping
    description: Detects repeated interface up/down transitions that may indicate a fault or network loop.
    match:
      rule_ids: ["100240"]
      groups: ["interface_flap", "interface_state"]
    default_severity: medium
    mitre:
      - id: T1498
        name: Network Denial of Service
        tactic: Impact
    recommended_response:
      en: Check the cable, peer device and interface counters, then isolate a possible loop.
      vi: Kiểm tra cáp, thiết bị đầu bên kia và bộ đếm cổng, sau đó cô lập vòng lặp mạng nếu có.

  - id: arp-spoofing
    name: ARP spoofing
    description: Detects conflicting ARP bindings or behavior consistent with ARP cache poisoning.
    match:
      rule_ids: ["100251"]
      groups: ["arp_spoofing", "arp_poisoning"]
    default_severity: critical
    mitre:
      - id: T1557.002
        name: Adversary-in-the-Middle - ARP Cache Poisoning
        tactic: Credential Access
    recommended_response:
      en: Quarantine the source host, verify ARP bindings and inspect affected endpoints for interception.
      vi: Cách ly máy nguồn, xác minh bảng ánh xạ ARP và kiểm tra các máy bị ảnh hưởng để tìm dấu hiệu nghe lén.

  - id: mac-flooding-port-security
    name: MAC flooding or port-security violation
    description: Detects excessive MAC learning or a switch port-security violation.
    match:
      rule_ids: ["100250", "100252"]
      groups: ["mac_flooding", "port_security"]
    default_severity: critical
    mitre:
      - id: T1498
        name: Network Denial of Service
        tactic: Impact
    recommended_response:
      en: Disable or quarantine the affected access port and inspect the connected source host.
      vi: Tắt hoặc cách ly cổng access bị ảnh hưởng và kiểm tra máy nguồn đang kết nối.

  - id: vlan-hopping
    name: VLAN hopping
    description: Detects double-tagged frames or unauthorized trunk negotiation on an access port.
    match:
      rule_ids: ["100260"]
      groups: ["vlan_hopping", "double_tagging"]
    default_severity: critical
    mitre:
      - id: T1595.002
        name: Active Scanning - Vulnerability Scanning
        tactic: Reconnaissance
    recommended_response:
      en: Quarantine the port and verify access mode, native VLAN and trunk negotiation settings.
      vi: Cách ly cổng và kiểm tra chế độ access, native VLAN cùng cấu hình thương lượng trunk.

  - id: syn-flood
    name: SYN flood or denial of service
    description: Detects a TCP SYN rate that exceeds the configured denial-of-service threshold.
    match:
      rule_ids: ["100270"]
      groups: ["syn_flood", "dos"]
    default_severity: critical
    mitre:
      - id: T1498.001
        name: Network Denial of Service - Direct Network Flood
        tactic: Impact
    recommended_response:
      en: Enable SYN protection or rate limiting, block abusive sources and preserve traffic evidence.
      vi: Bật bảo vệ SYN hoặc giới hạn tốc độ, chặn nguồn tấn công và lưu giữ bằng chứng lưu lượng.

  - id: vpn-anomaly
    name: VPN login anomaly
    description: Detects a VPN login from an unusual source, location or account context.
    match:
      rule_ids: ["100280"]
      groups: ["vpn_anomaly", "vpn_login_anomaly"]
    default_severity: high
    mitre:
      - id: T1078
        name: Valid Accounts
        tactic: Initial Access
    recommended_response:
      en: Validate the login with the user, revoke unexpected sessions and review MFA activity.
      vi: Xác minh lần đăng nhập với người dùng, thu hồi phiên bất thường và rà soát hoạt động MFA.

  - id: device-silent
    name: Device telemetry silent
    description: Detects a known device that has stopped sending telemetry for the configured interval.
    match:
      rule_ids: ["SYSTEM_DEVICE_SILENT"]
      groups: ["device_silent", "telemetry_health"]
    default_severity: high
    mitre:
      - id: T1489
        name: Service Stop
        tactic: Impact
    recommended_response:
      en: Verify device reachability and the log pipeline, then inspect the device for outage or tampering.
      vi: Kiểm tra khả năng kết nối và luồng thu thập log, sau đó xác minh thiết bị có sự cố hoặc bị can thiệp.
