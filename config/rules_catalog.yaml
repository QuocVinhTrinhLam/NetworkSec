use_cases:
  - id: port-scan
    name: Port scan against the firewall
    rule_ids: ["100201"]
    groups: ["port_scan"]
    severity: high
    recommended_response: Block or rate-limit the source IP and verify exposed services.
  - id: network-brute-force
    name: SSH, Telnet or Winbox brute force
    rule_ids: ["100210"]
    groups: ["brute_force"]
    severity: critical
    recommended_response: Block the source IP, review authentication logs and rotate exposed credentials.
  - id: admin-login
    name: Administrative login to a network device
    rule_ids: ["100220"]
    groups: ["admin_login"]
    severity: medium
    recommended_response: Confirm the login with the change window and investigate unexpected accounts or sources.
  - id: configuration-change
    name: Network device configuration change
    rule_ids: ["100230"]
    groups: ["config_changed"]
    severity: high
    recommended_response: Compare the running configuration with the approved baseline and identify the operator.
  - id: interface-flapping
    name: Interface up/down flapping
    rule_ids: ["100240"]
    groups: ["interface_flap"]
    severity: medium
    recommended_response: Check the cable, peer device and interface counters; isolate a possible loop.
  - id: layer2-violation
    name: ARP spoofing, MAC flooding or port-security violation
    rule_ids: ["100250"]
    groups: ["arp_spoofing", "mac_flooding", "port_security"]
    severity: critical
    recommended_response: Disable or quarantine the affected access port and inspect the source host.
  - id: vlan-hopping
    name: VLAN hopping attempt
    rule_ids: ["100260"]
    groups: ["vlan_hopping"]
    severity: critical
    recommended_response: Quarantine the port and verify access-port mode, native VLAN and trunk negotiation settings.
  - id: syn-flood
    name: SYN flood or denial of service
    rule_ids: ["100270"]
    groups: ["syn_flood", "dos"]
    severity: critical
    recommended_response: Enable rate limiting or SYN protection, block abusive sources and preserve traffic evidence.
  - id: vpn-anomaly
    name: VPN login anomaly
    rule_ids: ["100280"]
    groups: ["vpn_anomaly"]
    severity: high
    recommended_response: Validate the login with the user, revoke the session if unexpected and review MFA activity.
