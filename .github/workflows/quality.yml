name: Foundation quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint
        run: python -m ruff check app tests scripts

      - name: Check formatting
        run: python -m ruff format --check app tests scripts

      - name: Type check
        run: python -m mypy app

      - name: Run fast test suite
        run: python -m pytest -m "not e2e and not syslog_integration" --cov=app --cov-report=term-missing

  compose-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate Compose model without printing resolved environment
        shell: bash
        run: |
          SESSION_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" \
            docker compose --file compose.yaml config --quiet

  syslog-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Start and validate rsyslog
        run: docker compose --file compose.yaml up --detach --wait rsyslog

      - name: Exercise TCP and UDP ingestion
        env:
          RUN_SYSLOG_INTEGRATION: "1"
        run: python -m pytest -m syslog_integration tests/integration

      - name: Stop rsyslog without deleting its volume
        if: ${{ always() }}
        run: docker compose --file compose.yaml stop rsyslog
