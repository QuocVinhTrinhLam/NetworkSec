[project]
name = "network-security-monitor"
version = "0.1.0"
description = "Lightweight Wazuh alert dashboard and Telegram bot"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
