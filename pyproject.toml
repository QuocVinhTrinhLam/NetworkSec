[project]
name = "network-security-monitor"
version = "0.1.0"
description = "Lightweight Wazuh alert dashboard and Telegram bot"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests/test_e2e_playwright.py"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
