x-common-environment: &common-environment
  APP_URL: ${APP_URL:-http://localhost:8000}
  DATABASE_PATH: /app/data/monitor.db
  DEVICE_SILENT_MINUTES: ${DEVICE_SILENT_MINUTES:-15}
  JSON_LOGS: ${JSON_LOGS:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  RAW_LOG_MAX_LENGTH: ${RAW_LOG_MAX_LENGTH:-4096}
  RULES_CATALOG: /app/config/rules_catalog.yaml
  SEVERITY_CONFIG: /app/config/severity_map.yaml

x-common-service: &common-service
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: networksec-phase1:local
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    - monitor-data:/app/data
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "2"

services:
  dashboard:
    <<: *common-service
    environment:
      <<: *common-environment
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ALERT_SOURCE: ${ALERT_SOURCE:-mock}
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Network Security Monitor}
      BIND_HOST: ${BIND_HOST:-127.0.0.1}
      MOCK_MODE: ${MOCK_MODE:-true}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      SESSION_SECRET: ${SESSION_SECRET:-development-only-change-me}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${DASHBOARD_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 96m

  bot:
    <<: *common-service
    command: ["python", "-m", "app.bot"]
    environment:
      <<: *common-environment
      ALERT_SOURCE: ${ALERT_SOURCE:-mock}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS:-}
      DEDUP_WINDOW_SECONDS: ${DEDUP_WINDOW_SECONDS:-60}
      MAX_MESSAGES_PER_MINUTE: ${MAX_MESSAGES_PER_MINUTE:-20}
      NOTIFICATION_INTERVAL_SECONDS: ${NOTIFICATION_INTERVAL_SECONDS:-2}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-10}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_MIN_SEVERITY: ${TELEGRAM_MIN_SEVERITY:-medium}
      TELEGRAM_RATE_WINDOW_SECONDS: ${TELEGRAM_RATE_WINDOW_SECONDS:-60}
      TELEGRAM_TIMEZONE: ${TELEGRAM_TIMEZONE:-Asia/Ho_Chi_Minh}
      WAZUH_CA_FILE: ${WAZUH_CA_FILE:-}
      WAZUH_INDEXER_URL: ${WAZUH_INDEXER_URL:-https://wazuh-indexer:9200}
      WAZUH_INDEX_PATTERN: ${WAZUH_INDEX_PATTERN:-wazuh-alerts-*}
      WAZUH_PASSWORD: ${WAZUH_PASSWORD:-}
      WAZUH_USERNAME: ${WAZUH_USERNAME:-}
      WAZUH_VERIFY_TLS: ${WAZUH_VERIFY_TLS:-true}
    depends_on:
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/tmp/bot.ready').exists()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 96m

  mock:
    <<: *common-service
    profiles: ["mock"]
    restart: "no"
    command:
      - python
      - -m
      - app.mock
      - --scenario
      - ${SCENARIO_NAME:-ssh_bruteforce}
      - --duration
      - ${SCENARIO_DURATION:-60}
      - --rate
      - ${MOCK_RATE_PER_SECOND:-0}
    environment:
      <<: *common-environment
      ALERT_SOURCE: mock
      MOCK_FIXTURE_PATH: /app/fixtures/alerts.json
      MOCK_SEVERITY_DISTRIBUTION: ${MOCK_SEVERITY_DISTRIBUTION:-low=40,medium=35,high=20,critical=5}
    depends_on:
      dashboard:
        condition: service_healthy
    mem_limit: 64m

volumes:
  monitor-data:
