services:
  monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - monitor-data:/app/data
      - ./config:/app/config:ro
    restart: unless-stopped
    mem_limit: 300m
    security_opt:
      - no-new-privileges:true

volumes:
  monitor-data:
